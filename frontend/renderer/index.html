<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; connect-src http://127.0.0.1:*; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;" />
  <title>小助</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 变形舞台：固定 350×520 居中于窗口，展开/收起动画用 CSS transform
       （GPU 合成器驱动），窗口本身只在动画前后各 resize 一次 -->
  <div id="morph-stage">
    <!-- 球形态层：变形动画期间显示（圆 → 椭圆 → 矩形） -->
    <div id="morph-ball">
      <div class="morph-inner">
        <span id="morph-status-dot"></span>
      </div>
    </div>

    <!-- 面板 UI 层：窗口尺寸超过阈值后淡入 -->
    <div id="panel-ui">
      <!-- 标题栏（可拖拽） -->
      <header id="titlebar">
        <div id="logo"><span class="dot"></span><span id="title">小助</span></div>
        <div id="status">
          <span id="thinking" class="hidden">思考中…</span>
          <span id="ctx-tokens" title="当前上下文 token 估算">…</span>
          <span id="heartbeat" title="下次主动找你"></span>
        </div>
        <div id="titlebar-btns">
          <button id="btn-settings" title="设置">⚙</button>
          <button id="btn-fold" title="收起（变回悬浮球）">—</button>
        </div>
      </header>

      <!-- Tab 导航 -->
      <nav id="tabs">
        <button class="tab active" data-tab="chat">聊天</button>
        <button class="tab" data-tab="calendar">日历<span id="agenda-badge" class="badge hidden"></span></button>
      </nav>

      <!-- 聊天 -->
      <section id="chat" class="view active">
        <div id="mounted-bar" class="hidden"></div>
        <div id="messages"></div>
        <audio id="tts-audio" hidden></audio>
        <button id="jump-bottom" class="hidden" title="回到最新消息">↓</button>
        <form id="input-bar">
          <textarea id="input" rows="1" placeholder="告诉小助你要做什么…（Enter 发送 / Shift+Enter 换行）"></textarea>
          <div id="input-actions">
            <button id="voice-btn" type="button" title="语音对话模式（免按连续对话，说话可打断小助）">🎤</button>
            <button id="send" type="submit" title="发送（长按：语音输入）">发送</button>
          </div>
        </form>
      </section>

      <!-- 日历（日程 / 当天任务，可编辑） -->
      <section id="calendar" class="view">
        <div id="cal-header">
          <button id="cal-prev" type="button" title="上个月">‹</button>
          <span id="cal-title"></span>
          <button id="cal-next" type="button" title="下个月">›</button>
          <button id="cal-today" type="button">今天</button>
        </div>
        <div id="cal-weekdays">
          <span>日</span><span>一</span><span>二</span><span>三</span>
          <span>四</span><span>五</span><span>六</span>
        </div>
        <div id="cal-grid"></div>
        <div id="cal-day">
          <div id="cal-day-title"></div>
          <div id="cal-day-list"></div>
          <form id="cal-add-form">
            <input id="cal-time" type="time" title="时刻（留空＝全天）" />
            <select id="cal-kind" title="类型">
              <option value="event">日程</option>
              <option value="task">任务</option>
            </select>
            <input id="cal-content" type="text" placeholder="添加日程或任务…（Enter 添加）" />
            <select id="cal-repeat" title="重复">
              <option value="">不重复</option>
              <option value="daily">每天</option>
              <option value="weekly">每周</option>
              <option value="weekdays">工作日</option>
            </select>
            <button type="submit">添加</button>
          </form>
        </div>
      </section>
    </div>
  </div>

  <script src="morph.js"></script>
  <script src="md.js"></script>
  <script src="mic.js"></script>
  <script src="voiceMode.js"></script>
  <script src="fileDrop.js"></script>
  <script src="app.js"></script>
</body>
</html>
