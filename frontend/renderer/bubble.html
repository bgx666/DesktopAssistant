<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; connect-src http://127.0.0.1:*; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; media-src http://127.0.0.1:*;" />
  <title>小助</title>
  <link rel="stylesheet" href="bubble.css" />
</head>
<body>
  <!-- 悬浮球：单击看最近回复 / 长按说话（点变红 + 音量动态环）/ 拖拽 / 右键菜单 -->
  <div id="ball">
    <!-- 录音音量环：12 条线条围绕球，随音量伸缩（录音中显示） -->
    <div id="sound-ring">
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
    </div>
    <div id="core" title="单击：看小助最近说了什么；长按：说话；右键：放大/免打扰/退出">
      <span id="status-dot"></span>
      <span id="badge" class="hidden"></span>
    </div>
  </div>
  <!-- 语音播报（气泡朗读）：audio 事件设 src 播放 -->
  <audio id="tts-audio" hidden></audio>
  <script src="mic.js"></script>
  <script src="bubble.js"></script>
</body>
</html>
