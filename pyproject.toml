[project]
name = "planner"
version = "0.1.0"
description = "学习工作助手 Agent：待办拆分 / 日计划安排 / 主动回访（Electron 悬浮窗）"
requires-python = ">=3.10"
dependencies = [
    "langchain>=1.3.14",
    "langchain-core>=1.5",
    "langchain-openai>=1.4",
    "langgraph>=1.0",
    "python-dotenv",
    "dashscope>=1.26.4",
    "funasr-onnx>=0.4.2",
    "onnxruntime>=1.18",
    "modelscope>=1.18",
    "numpy<2",
    "rapidocr_onnxruntime",
    "opencv-python-headless<5",
    "mss>=10",
    "pymupdf",
    "python-docx",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-mock"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
planner = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
