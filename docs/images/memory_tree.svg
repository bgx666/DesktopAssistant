      <rect x="62" y="336" width="22" height="22" rx="4" fill="url(#gLeaf)"/>
      <rect x="86" y="336" width="22" height="22" rx="4" fill="url(#gLeaf)" opacity="0.75"/>
      <rect x="110" y="336" width="22" height="22" rx="4" fill="url(#gLeaf)" opacity="0.55"/>
      <text x="90" y="378" text-anchor="middle" font-size="11" fill="#3d6a75">node0_001</text>
      <text x="90" y="393" text-anchor="middle" font-size="9.5" fill="#8fa8b8">第0-39条</text>
    </g>
    <g>
      <rect x="168" y="336" width="22" height="22" rx="4" fill="url(#gLeaf)"/>
      <rect x="192" y="336" width="22" height="22" rx="4" fill="url(#gLeaf)"/>
      <rect x="216" y="336" width="22" height="22" rx="4" fill="url(#gLeaf)" opacity="0.75"/>
      <rect x="240" y="336" width="22" height="22" rx="4" fill="url(#gLeaf)" opacity="0.55"/>
      <text x="220" y="378" text-anchor="middle" font-size="11" fill="#3d6a75">node0_002</text>
      <text x="220" y="393" text-anchor="middle" font-size="9.5" fill="#8fa8b8">第40-79条</text>
    </g>
    <g>
      <rect x="298" y="336" width="22" height="22" rx="4" fill="url(#gLeaf)"/>
      <rect x="322" y="336" width="22" height="22" rx="4" fill="url(#gLeaf)"/>
      <rect x="346" y="336" width="22" height="22" rx="4" fill="url(#gLeaf)" opacity="0.75"/>
      <rect x="370" y="336" width="22" height="22" rx="4" fill="url(#gLeaf)" opacity="0.55"/>
      <text x="350" y="378" text-anchor="middle" font-size="11" fill="#3d6a75">node0_003</text>
      <text x="350" y="393" text-anchor="middle" font-size="9.5" fill="#8fa8b8">第80-119条</text>
    </g>
    <g>
      <rect x="428" y="336" width="22" height="22" rx="4" fill="url(#gLeaf)"/>
      <rect x="452" y="336" width="22" height="22" rx="4" fill="url(#gLeaf)"/>
      <rect x="476" y="336" width="22" height="22" rx="4" fill="url(#gLeaf)" opacity="0.75"/>
      <rect x="500" y="336" width="22" height="22" rx="4" fill="url(#gLeaf)" opacity="0.55"/>
