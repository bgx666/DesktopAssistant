<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <!-- 背景 -->
  <rect x="0" y="0" width="900" height="660" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2f38">记忆树结构（3 层，2 合 1 简化示意）</text>

  <!-- 定义：渐变 -->
  <defs>
    <linearGradient id="gLeaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7deee3"/><stop offset="1" stop-color="#39c5bb"/>
    </linearGradient>
    <linearGradient id="gMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd4f2"/><stop offset="1" stop-color="#5fb8d6"/>
    </linearGradient>
    <linearGradient id="gRoot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9a9e8"/><stop offset="1" stop-color="#8f7fd6"/>
    </linearGradient>
  </defs>

  <!-- ══ 连线（子 → 父，正交）══ -->
  <g stroke="#9db8c9" stroke-width="1.6" fill="none">
    <!-- L1 → 根 -->
    <path d="M 450 118 L 450 150 L 285 150 L 285 196"/>
    <path d="M 450 150 L 615 150 L 615 196"/>
    <!-- L0 → L1 -->
    <path d="M 285 264 L 285 292 L 158 292 L 158 336"/>
    <path d="M 285 292 L 412 292 L 412 336"/>
    <path d="M 615 264 L 615 292 L 488 292 L 488 336"/>
    <path d="M 615 292 L 742 292 L 742 336"/>
  </g>

  <!-- ══ Level 2：根 ══ -->
  <g>
    <rect x="360" y="58" width="180" height="60" rx="12" fill="url(#gRoot)" stroke="#8f7fd6" stroke-width="1.2"/>
    <text x="450" y="85" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">node2_001</text>
    <text x="450" y="103" text-anchor="middle" font-size="10.5" fill="#eef2ff">整棵树的浓缩</text>
  </g>
  <text x="340" y="74" text-anchor="end" font-size="11" fill="#8fa8b8">Level 2</text>

  <!-- ══ Level 1：两个中间摘要 ══ -->
  <g>
    <rect x="215" y="196" width="140" height="68" rx="10" fill="url(#gMid)" stroke="#5fb8d6" stroke-width="1.2"/>
    <text x="285" y="222" text-anchor="middle" font-size="12.5" fill="#fff" font-weight="bold">node1_001</text>
    <text x="285" y="240" text-anchor="middle" font-size="10" fill="#eef6fc">2 片叶子 → 1 个摘要</text>
    <rect x="545" y="196" width="140" height="68" rx="10" fill="url(#gMid)" stroke="#5fb8d6" stroke-width="1.2"/>
    <text x="615" y="222" text-anchor="middle" font-size="12.5" fill="#fff" font-weight="bold">node1_002</text>
    <text x="615" y="240" text-anchor="middle" font-size="10" fill="#eef6fc">2 片叶子 → 1 个摘要</text>
  </g>
  <text x="197" y="230" text-anchor="end" font-size="11" fill="#8fa8b8">Level 1</text>

  <!-- ══ Level 0：四片叶子（每片 = 一段被压缩的原始对话，□ = 一条消息）══ -->
  <g>
    <!-- 叶子 1 -->
    <g>
      <g>
        <rect x="130" y="336" width="22" height="22" rx="4" fill="url(#gLeaf)"/>
        <rect x="156" y="336" width="22" height="22" rx="4" fill="url(#gLeaf)"/>
        <rect x="182" y="336" width="22" height="22" rx="4" fill="url(#gLeaf)" opacity="0.75"/>
        <rect x="208" y="336" width="22" height="22" rx="4" fill="url(#gLeaf)" opacity="0.55"/>
      </g>
      <text x="185" y="378" text-anchor="middle" font-size="11" fill="#3d6a75">node0_001 · 第0-39条</text>
      <text x="185" y="393" text-anchor="middle" font-size="9.5" fill="#8fa8b8">□ = 一条消息</text>
    </g>
    <!-- 叶子 2 -->
    <g>
      <g>
        <rect x="384" y="336" width="22" height="22" rx="4" fill="url(#gLeaf)"/>
        <rect x="410" y="336" width="22" height="22" rx="4" fill="url(#gLeaf)"/>
        <rect x="436" y="336" width="22" height="22" rx="4" fill="url(#gLeaf)" opacity="0.75"/>
        <rect x="462" y="336" width="22" height="22" rx="4" fill="url(#gLeaf)" opacity="0.55"/>
      </g>
      <text x="439" y="378" text-anchor="middle" font-size="11" fill="#3d6a75">node0_002 · 第40-79条</text>
      <text x="439" y="393" text-anchor="middle" font-size="9.5" fill="#8fa8b8">原文存在节点里</text>
    </g>
    <!-- 叶子 3 -->
    <g>
      <g>
        <rect x="460" y="336" width="22" height="22" rx="4" fill="url(#gLeaf)"/>
        <rect x="486" y="336" width="22" height="22" rx="4" fill="url(#gLeaf)"/>
        <rect x="512" y="336" width="22" height="22" rx="4" fill="url(#gLeaf)" opacity="0.75"/>
        <rect x="538" y="336" width="22" height="22" rx="4" fill="url(#gLeaf)" opacity="0.55"/>
      </g>
      <text x="515" y="378" text-anchor="middle" font-size="11" fill="#3d6a75">node0_003 · 第80-119条</text>
      <text x="515" y="393" text-anchor="middle" font-size="9.5" fill="#8fa8b8">可 explore 展开</text>
    </g>
    <!-- 叶子 4 -->
    <g>
      <g>
        <rect x="714" y="336" width="22" height="22" rx="4" fill="url(#gLeaf)"/>
        <rect x="740" y="336" width="22" height="22" rx="4" fill="url(#gLeaf)"/>
        <rect x="766" y="336" width="22" height="22" rx="4" fill="url(#gLeaf)" opacity="0.75"/>
        <rect x="792" y="336" width="22" height="22" rx="4" fill="url(#gLeaf)" opacity="0.55"/>
      </g>
      <text x="769" y="378" text-anchor="middle" font-size="11" fill="#3d6a75">node0_004 · 第120-159条</text>
      <text x="769" y="393" text-anchor="middle" font-size="9.5" fill="#8fa8b8">最早的一段</text>
    </g>
  </g>
  <text x="112" y="348" text-anchor="end" font-size="11" fill="#8fa8b8">Level 0</text>

  <!-- 压缩规则说明 -->
  <text x="450" y="428" text-anchor="middle" font-size="11" fill="#5a6b7d">
    触发：对话满 60 条 → 最早 40 条压成 1 片叶子（保留最近 20 条）｜ 向上：满 8 个节点取前 4 个合并（此处简化为 2 合 1）
  </text>

  <!-- ══ Buffer state ══ -->
  <g>
    <rect x="60" y="455" width="780" height="180" rx="12" fill="#f4f8fb" stroke="#d6e2ec" stroke-width="1.4"/>
    <text x="450" y="480" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2b2f38">Buffer state —— 压缩后，模型每一轮实际看到的上下文</text>

    <!-- 根摘要块 -->
    <rect x="80" y="500" width="110" height="52" rx="9" fill="url(#gRoot)" stroke="#8f7fd6"/>
    <text x="135" y="525" text-anchor="middle" font-size="11.5" fill="#fff" font-weight="bold">node2_001</text>
    <text x="135" y="541" text-anchor="middle" font-size="9.5" fill="#eef2ff">旧记忆浓缩</text>

    <!-- 最近 L1 -->
    <rect x="205" y="500" width="100" height="52" rx="9" fill="url(#gMid)" stroke="#5fb8d6"/>
    <text x="255" y="525" text-anchor="middle" font-size="11.5" fill="#fff" font-weight="bold">node1_002</text>
    <text x="255" y="541" text-anchor="middle" font-size="9.5" fill="#eef6fc">最近的中间层</text>

    <!-- 最新 20 条对话 -->
    <g>
      <rect x="320" y="496" width="500" height="60" rx="8" fill="#ffffff" stroke="#d6e2ec"/>
      <text x="335" y="512" font-size="10" fill="#8fa8b8">最近 20 条对话（原样保留）</text>
      <g>
        <rect x="335" y="521" width="20" height="20" rx="4" fill="#9adfd6"/>
        <rect x="359" y="521" width="20" height="20" rx="4" fill="#9adfd6"/>
        <rect x="383" y="521" width="20" height="20" rx="4" fill="#9adfd6"/>
        <rect x="407" y="521" width="20" height="20" rx="4" fill="#9adfd6"/>
        <rect x="431" y="521" width="20" height="20" rx="4" fill="#9adfd6"/>
        <rect x="455" y="521" width="20" height="20" rx="4" fill="#9adfd6"/>
        <rect x="479" y="521" width="20" height="20" rx="4" fill="#9adfd6"/>
        <rect x="503" y="521" width="20" height="20" rx="4" fill="#9adfd6"/>
        <rect x="527" y="521" width="20" height="20" rx="4" fill="#9adfd6"/>
        <rect x="551" y="521" width="20" height="20" rx="4" fill="#9adfd6"/>
        <rect x="575" y="521" width="20" height="20" rx="4" fill="#9adfd6" opacity="0.85"/>
        <rect x="599" y="521" width="20" height="20" rx="4" fill="#9adfd6" opacity="0.7"/>
        <rect x="623" y="521" width="20" height="20" rx="4" fill="#9adfd6" opacity="0.7"/>
        <rect x="647" y="521" width="20" height="20" rx="4" fill="#9adfd6" opacity="0.55"/>
        <rect x="671" y="521" width="20" height="20" rx="4" fill="#9adfd6" opacity="0.55"/>
        <rect x="695" y="521" width="20" height="20" rx="4" fill="#9adfd6" opacity="0.4"/>
        <rect x="719" y="521" width="20" height="20" rx="4" fill="#9adfd6" opacity="0.4"/>
        <rect x="743" y="521" width="20" height="20" rx="4" fill="#9adfd6" opacity="0.25"/>
        <rect x="767" y="521" width="20" height="20" rx="4" fill="#9adfd6" opacity="0.25"/>
        <rect x="791" y="521" width="20" height="20" rx="4" fill="#9adfd6" opacity="0.15"/>
      </g>
    </g>

    <!-- 标注箭头 -->
    <g stroke="#8fa8b8" stroke-width="1.4" fill="none">
      <path d="M 185 566 L 135 566 L 135 590 M 135 590 L 60 590"/>
      <path d="M 570 566 L 570 590 L 840 590"/>
    </g>
    <text x="98" y="608" text-anchor="middle" font-size="11" fill="#5a6b7d">旧对话早已压进树里，只剩摘要占位</text>
    <text x="705" y="608" text-anchor="middle" font-size="11" fill="#5a6b7d">最新对话原样在场，随时可答</text>
    <text x="450" y="628" text-anchor="middle" font-size="10.5" fill="#8fa8b8">→ 上下文窗口恒定（约 20 条 + 摘要），而记忆树无限生长</text>
  </g>
</svg>
