    <!-- node2_001 根 -->
    <rect x="60" y="498" width="150" height="56" rx="9" fill="url(#gRoot)" stroke="#8f7fd6"/>
    <text x="135" y="524" text-anchor="middle" font-size="11.5" fill="#fff" font-weight="bold">node2_001</text>
    <text x="135" y="541" text-anchor="middle" font-size="9.5" fill="#eef2ff">旧记忆浓缩（含 1_001/002）</text>

    <!-- node1_003 最近中间层 -->
    <rect x="230" y="498" width="150" height="56" rx="9" fill="url(#gMid)" stroke="#2e9e6b" stroke-width="2"/>
    <text x="305" y="524" text-anchor="middle" font-size="11.5" fill="#fff" font-weight="bold">node1_003</text>
    <text x="305" y="541" text-anchor="middle" font-size="9.5" fill="#eef6fc">最近中间层 · 未合并</text>

    <!-- 最近叶子 007/008 -->
    <rect x="400" y="498" width="82" height="56" rx="8" fill="url(#gLeaf)" stroke="#2e9e6b" stroke-width="1.6"/>
    <text x="441" y="522" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">node0_007</text>
    <text x="441" y="539" text-anchor="middle" font-size="9" fill="#eafaf6">最近叶子</text>
    <rect x="492" y="498" width="82" height="56" rx="8" fill="url(#gLeaf)" stroke="#2e9e6b" stroke-width="1.6"/>
    <text x="533" y="522" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">node0_008</text>
    <text x="533" y="539" text-anchor="middle" font-size="9" fill="#eafaf6">最近叶子</text>

    <!-- 最新 20 条对话 -->
    <g>
      <rect x="594" y="494" width="446" height="64" rx="8" fill="#ffffff" stroke="#d6e2ec"/>
      <text x="609" y="510" font-size="10" fill="#8fa8b8">最近 20 条对话（原样保留）</text>
      <g>
        <rect x="609" y="519" width="20" height="20" rx="4" fill="#9adfd6"/>
        <rect x="633" y="519" width="20" height="20" rx="4" fill="#9adfd6"/>
        <rect x="657" y="519" width="20" height="20" rx="4" fill="#9adfd6"/>
