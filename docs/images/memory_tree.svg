      <text x="870" y="378" text-anchor="middle" font-size="11" fill="#2e7d4f">node0_007</text>
      <text x="870" y="393" text-anchor="middle" font-size="9.5" fill="#8fa8b8">第240-279条 · 未合并</text>
    </g>
    <g>
      <rect x="948" y="336" width="22" height="22" rx="4" fill="url(#gLeaf)" stroke="#2e9e6b" stroke-width="2"/>
      <rect x="972" y="336" width="22" height="22" rx="4" fill="url(#gLeaf)" stroke="#2e9e6b" stroke-width="2"/>
      <rect x="996" y="336" width="22" height="22" rx="4" fill="url(#gLeaf)" opacity="0.75" stroke="#2e9e6b" stroke-width="2"/>
      <rect x="1020" y="336" width="22" height="22" rx="4" fill="url(#gLeaf)" opacity="0.55" stroke="#2e9e6b" stroke-width="2"/>
