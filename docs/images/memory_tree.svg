  <text x="20" y="348" text-anchor="end" font-size="11" fill="#8fa8b8">Level 0</text>

  <!-- 压缩规则说明 -->
  <text x="550" y="428" text-anchor="middle" font-size="11" fill="#5a6b7d">
    触发：对话满 60 条 → 最早 40 条压成 1 片叶子（保留最近 20 条）｜ 某层节点满 8 个 → 取前 4 个合并成上层节点（图中简化为 2 合 1）
  </text>

  <!-- ══ Buffer state ══ -->
