    <text x="306" y="640" text-anchor="middle" font-size="10.5" fill="#5a6b7d">未合并的中间层/叶子仍在场</text>
    <text x="955" y="614" text-anchor="middle" font-size="11" fill="#5a6b7d">最新对话原样在场</text>
    <text x="550" y="672" text-anchor="middle" font-size="10.5" fill="#8fa8b8">→ 上下文窗口恒定（摘要节点 + 最近 20 条），而记忆树无限生长</text>
  </g>
</svg>
