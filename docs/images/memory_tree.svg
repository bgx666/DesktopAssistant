    <text x="155" y="240" text-anchor="middle" font-size="10" fill="#eef6fc">node0_001+002</text>

    <rect x="340" y="196" width="150" height="68" rx="10" fill="url(#gMid)" stroke="#5fb8d6" stroke-width="1.2"/>
    <text x="415" y="222" text-anchor="middle" font-size="12.5" fill="#fff" font-weight="bold">node1_002</text>
    <text x="415" y="240" text-anchor="middle" font-size="10" fill="#eef6fc">node0_003+004</text>

    <rect x="600" y="196" width="150" height="68" rx="10" fill="url(#gMid)" stroke="#2e9e6b" stroke-width="2.2"/>
    <text x="675" y="222" text-anchor="middle" font-size="12.5" fill="#fff" font-weight="bold">node1_003</text>
