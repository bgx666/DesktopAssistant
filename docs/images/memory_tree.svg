        <rect x="873" y="519" width="20" height="20" rx="4" fill="#9adfd6" opacity="0.7"/>
        <rect x="897" y="519" width="20" height="20" rx="4" fill="#9adfd6" opacity="0.7"/>
        <rect x="921" y="519" width="20" height="20" rx="4" fill="#9adfd6" opacity="0.55"/>
        <rect x="945" y="519" width="20" height="20" rx="4" fill="#9adfd6" opacity="0.55"/>
        <rect x="969" y="519" width="20" height="20" rx="4" fill="#9adfd6" opacity="0.4"/>
        <rect x="993" y="519" width="20" height="20" rx="4" fill="#9adfd6" opacity="0.4"/>
        <rect x="1017" y="519" width="20" height="20" rx="4" fill="#9adfd6" opacity="0.25"/>
