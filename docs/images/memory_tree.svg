<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <!-- 背景 -->
  <rect x="0" y="0" width="1100" height="720" fill="#ffffff"/>
  <text x="550" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b2f38">记忆树结构（node{level}_{编号} 命名，与代码一致）</text>

  <!-- 定义：渐变 -->
  <defs>
    <linearGradient id="gLeaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7deee3"/><stop offset="1" stop-color="#39c5bb"/>
    </linearGradient>
    <linearGradient id="gMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd4f2"/><stop offset="1" stop-color="#5fb8d6"/>
    </linearGradient>
    <linearGradient id="gRoot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9a9e8"/><stop offset="1" stop-color="#8f7fd6"/>
    </linearGradient>
  </defs>

  <!-- ══ 连线（子 → 父，正交）══ -->
  <g stroke="#9db8c9" stroke-width="1.6" fill="none">
    <!-- L1 → L2 根 -->
    <path d="M 155 264 L 155 150 L 285 150 L 285 118"/>
    <path d="M 415 264 L 415 150 L 285 150"/>
    <!-- L0 → L1 -->
    <path d="M 90 336 L 90 292 L 155 292 L 155 264"/>
    <path d="M 220 336 L 220 292 L 155 292"/>
    <path d="M 350 336 L 350 292 L 415 292 L 415 264"/>
    <path d="M 480 336 L 480 292 L 415 292"/>
    <path d="M 610 336 L 610 292 L 675 292 L 675 264"/>
    <path d="M 740 336 L 740 292 L 675 292"/>
  </g>

  <!-- ══ Level 2：根 ══ -->
  <g>
    <rect x="205" y="58" width="160" height="60" rx="12" fill="url(#gRoot)" stroke="#8f7fd6" stroke-width="1.2"/>
    <text x="285" y="85" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">node2_001</text>
    <text x="285" y="103" text-anchor="middle" font-size="10" fill="#eef2ff">node1_001 + node1_002 合并</text>
  </g>
  <text x="187" y="78" text-anchor="end" font-size="11" fill="#8fa8b8">Level 2</text>

  <!-- ══ Level 1：三个中间节点 ══ -->
  <g>
    <rect x="80" y="196" width="150" height="68" rx="10" fill="url(#gMid)" stroke="#5fb8d6" stroke-width="1.2"/>
